name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Biopython is installed as a dependency
        run: python -c "import Bio"
      - name: Tests
        run: pytest -q
      - name: Command line runs on the example
        run: rggmci examples/VWPH00000000.1_subset.antismash.zip --out /tmp/result.json --pairs /tmp/pairs.tsv
