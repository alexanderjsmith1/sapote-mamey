[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rggmci"
version = "1.0.0rc4"
description = "Surfaces antiSMASH regions in a fragmented assembly that may belong to one biosynthetic pathway"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
# Biopython reads joined and origin-spanning CDS locations; the built-in reader refuses them.
dependencies = ["biopython>=1.83,<2.0"]

[project.urls]
Repository = "https://github.com/alexanderjsmith1/rggmci"

[project.optional-dependencies]
# Kept so `pip install "rggmci[bio]"` still works; Biopython is now a required dependency.
bio = []

[project.scripts]
rggmci = "rggmci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rggmci = ["PROVENANCE.json"]
