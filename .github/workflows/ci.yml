name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_configured_suite:
        description: "Run slow/network suite with admitted data and resource prerequisites"
        type: boolean
        default: false

jobs:
  test:
    name: Test suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[figures,bio,documents,test]'
          # Fail before testing if PDF inspection or process supervision is unavailable.
          python -c "import build, pytest, pdfplumber, psutil; print('Test dependencies:', build.__version__, pytest.__version__, pdfplumber.__version__, psutil.__version__)"

      # .452: the R figure renderers are tested on CI, not skipped. setup-r supplies R; the system libraries are what
      # systemfonts/svglite/xml2/curl compile against; the bundle installer exits non-zero if any package is missing.
      - uses: r-lib/actions/setup-r@v2
        with:
          # Pin interpreter selection; package and runner versions remain separate.
          r-version: "4.5.3"
          use-public-rspm: true
      - name: R system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libxml2-dev libfontconfig1-dev libfreetype-dev \
            libharfbuzz-dev libfribidi-dev libpng-dev libjpeg-dev libtiff5-dev \
            libuv1-dev libcairo2-dev   # fs (for yulab.utils, ggfun, aplot) needs libuv; gdtools (for ggtree) needs cairo
      - name: R figure packages
        run: Rscript bundle_support/install_r_figure_packages.R

      # No third-party reference data is redistributed (v9.7.362), so the dataset-dependent
      # tests SKIP here by design. That is the contract, not a gap: see docs/EXTERNAL_DATA.md.
      - name: Test suite
        run: pytest -q

      - name: Configured full suite (explicit manual opt-in)
        if: github.event_name == 'workflow_dispatch' && inputs.run_configured_suite
        run: python -B -m pytest -q -p no:cacheprovider --run-slow --run-network

      - name: Public suite (hermetic release invariants)
        run: pytest -m public -q

      - name: Wheel builds and imports clean
        run: |
          python -m build --wheel
          python -m venv "$RUNNER_TEMP/mamey-wheel-smoke"
          "$RUNNER_TEMP/mamey-wheel-smoke/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/mamey-wheel-smoke/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/mamey-wheel-smoke/bin/python" -c "from importlib.resources import files; import mamey; assert (files('mamey') / 'evidence_disagreements.html').is_file(); assert (files('mamey') / 'enzyme_neighborhoods.html').is_file(); print(mamey.__version__)"
          "$RUNNER_TEMP/mamey-wheel-smoke/bin/mamey" --version
          "$RUNNER_TEMP/mamey-wheel-smoke/bin/sapote-render" --help >/dev/null
          "$RUNNER_TEMP/mamey-wheel-smoke/bin/sapote-documents" --help >/dev/null

  gates:
    name: Release gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .            # install the PACKAGE (P4)

      # These are the gates a release cut runs. They are cheap and they catch the
      # failure classes this project has actually been bitten by.
      - name: Version sync
        run: python tools/sync_version.py --check
      - name: Release identity
        run: python tools/verify_release_identity.py
      - name: Release manifest describes the tree
        run: python tools/check_release_manifest.py
      - name: Module accretion
        run: python tools/check_module_accretion.py
      - name: Monolith freshness
        run: python tools/check_monolith_freshness.py
      - name: Repo health (strict)
        run: python tools/repo_health.py --strict
      - name: Public-release audit (fail-closed leak gate)
        run: python tools/public_release_audit.py .
